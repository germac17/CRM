# Render Blueprint — naymi.tech (Backend + AI)
# Документация: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: naymi-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: AI_SERVICE_URL
        sync: false
        # Укажите URL AI-сервиса после деплоя naymi-ai (см. DEPLOY_AI.md)

  - type: web
    name: naymi-ai
    runtime: python
    rootDir: ai
    buildCommand: pip install -r requirements.txt && python -m spacy download ru_core_news_md
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT

version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - AI_SERVICE_URL=http://ai-service:8001
    volumes:
      - ./backend/data:/app/data
    depends_on:
      - ai-service
    restart: unless-stopped
    networks:
      - hr-crm-network

  # AI Service
  ai-service:
    build:
      context: ./ai
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8001
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/data:/app/../backend/data:ro
    restart: unless-stopped
    networks:
      - hr-crm-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_AI_URL=http://localhost:8001
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - hr-crm-network

networks:
  hr-crm-network:
    driver: bridge

volumes:
  backend-data:
